<script>
  const index = buildSearchIndex();
  const input = document.getElementById('search-input');
  const resultsEl = document.getElementById('search-results');
  const statusEl = document.getElementById('search-status');

  const TYPE_ICON = { lesson: '📖', formula: '🧠', example: '✏️', python: '🐍', tool: '🛠️' };

  function render(query) {
    if (!query.trim()) {
      statusEl.textContent = '';
      resultsEl.innerHTML = '';
      return;
    }
    const results = runSearch(index, query);
    statusEl.textContent = `พบ ${results.length} ผลลัพธ์สำหรับ “${query}”`;
    resultsEl.innerHTML = results.length ? results.map(r => {
      const tag = r.ready
        ? `<span class="t-status ready">${TYPE_ICON[r.type] || '📄'} ${r.typeLabel}</span>`
        : `<span class="t-status soon">กำลังจัดทำ</span>`;
      const el = r.url ? 'a' : 'div';
      const href = r.url ? `href="${r.url}"` : '';
      return `<${el} class="topic-card${r.url ? '' : ' disabled'}" ${href}>
        <span class="t-name">${escapeHtml(r.title)}${r.sub ? `<br><span style="font-family:var(--font-mono); font-size:0.82rem; color:var(--ink-soft); font-weight:400;">${escapeHtml(r.sub)}</span>` : ''}</span>
        ${tag}
      </${el}>`;
    }).join('') : '<p style="color:var(--ink-soft);">ไม่พบผลลัพธ์ ลองใช้คำค้นหาอื่น</p>';
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  input.addEventListener('input', () => render(input.value));

  const initialQ = new URLSearchParams(window.location.search).get('q') || '';
  if (initialQ) { input.value = initialQ; render(initialQ); }
</script>
