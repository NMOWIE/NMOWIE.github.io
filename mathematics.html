<script src="mathematics-data.js"></script>
<script src="main.js"></script>
<script>
  const GRADE_ORDER = ['m1', 'm2', 'm3', 'm4', 'm5', 'm6'];

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function renderTabs(activeGrade) {
    const wrap = document.getElementById('grade-tabs');
    wrap.innerHTML = '';
    GRADE_ORDER.forEach(key => {
      const grade = MATH_CURRICULUM[key];
      const btn = document.createElement('button');
      btn.className = 'grade-tab' + (key === activeGrade ? ' active' : '');
      btn.textContent = grade.label;
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', String(key === activeGrade));
      btn.addEventListener('click', () => {
        const url = new URL(window.location);
        url.searchParams.set('grade', key);
        window.history.pushState({}, '', url);
        loadGrade(key);
      });
      wrap.appendChild(btn);
    });
  }

  function renderTopics(gradeKey) {
    const grade = MATH_CURRICULUM[gradeKey];
    const grid = document.getElementById('topic-grid');
    grid.innerHTML = '';
    grade.topics.forEach(topic => {
      const ready = Boolean(topic.lesson);
      const el = document.createElement(ready ? 'a' : 'div');
      el.className = 'topic-card' + (ready ? '' : ' disabled');
      if (ready) el.href = `lesson.html?topic=${topic.id}`;
      el.innerHTML = `
        <span class="t-name">${topic.title}</span>
        <span class="t-status ${ready ? 'ready' : 'soon'}">${ready ? 'พร้อมเรียน' : 'กำลังจัดทำ'}</span>
      `;
      grid.appendChild(el);
    });
  }

  function loadGrade(gradeKey) {
    const grade = MATH_CURRICULUM[gradeKey];
    document.getElementById('grade-title').textContent = `คณิตศาสตร์ ${grade.fullLabel}`;
    renderTabs(gradeKey);
    renderTopics(gradeKey);
  }

  const initialGrade = GRADE_ORDER.includes(getParam('grade')) ? getParam('grade') : 'm4';
  loadGrade(initialGrade);
</script>
</body>
</html>
